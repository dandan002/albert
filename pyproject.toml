[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "albert"
version = "0.2.0"
description = "Prediction-market research and small-bankroll systematic trading"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.25.0",
    "httpx>=0.28.1",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "zstandard>=0.23",
    "cryptography>=42",
    "websockets>=13",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[project.scripts]
albert = "albert.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Sortedness of columns cannot be checked:UserWarning"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as call defaults; they are evaluated once by design.
# The config defaults are frozen dataclasses, so a shared default instance is safe.
extend-immutable-calls = ["typer.Option", "typer.Argument", "albert.risk.RiskConfig",
                          "albert.research.wallets.WalletScoreConfig",
                          "albert.research.nba_props.TeamParams"]

[tool.ruff.lint.per-file-ignores]
# Research closures over loop variables are all called within the same iteration (checked
# 2026-11-07), so B023's late-binding hazard does not apply there.
"src/albert/research/*" = ["B023"]
