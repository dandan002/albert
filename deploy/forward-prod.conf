# Arguments for `albert live forward --env prod` (systemd unit albert-live-forward@prod): REAL ORDERS.
# Started 2026-11-25, user: "Let's just run the approval NO and culture maker live please" (after 4 days
# of paper; the paper pass bars were not met and the user chose to go live; paper keeps running).
#  - cmn (albc): culture maker NO, the paper_forward rule; worst case (resting NO bids + unsettled
#    fills) <= $15.
#  - apr (alba): approval 5-15c NO, IOC taker at 1 - bid; worst case (unsettled fills) <= $5; skips
#    legs where NO + fee >= 99c.
# With mentions' $40 cap the bots' worst cases sum to the guard's $60 at-risk KILL line.
# Needs KALSHI_LIVE_ENABLED=1 in .env. Stop: touch data/live/forward/STOP (stays until removed) or
# systemctl stop albert-live-forward@prod (SIGTERM cancels every albc/alba order; the next start
# reposts the cancelled cmn bids). Ledger: data/live/forward/prod/ledger.jsonl.
FORWARD_ARGS=--live --rules cmn,apr --cmn-cap 15 --apr-cap 5 --poll-s 60
