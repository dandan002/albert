# Arguments for `albert live guard --env prod` (systemd unit albert-guard@prod). Phase 6, built
# 2026-11-19 (user: "Let's build phase 6 we're live trading already anyway").
# Account-wide backstop above every bot's own limits (albert.live_guard):
#  - bot-book day PnL (every alb* fill marked to the mid or settlement, since 00:00 UTC) below -$15
#    -> data/live/HALT.json until the next 00:00 UTC: new orders refused, bot orders cancelled;
#  - resting bot collateral + unsettled bot fill cost above $60 -> data/live/KILL (mentions caps
#    itself at $40, so this means a bug) and every bot order cancelled. Remove with `albert live resume`.
# It also appends every account fill to data/live/audit/prod/fills.jsonl. Its client is cancel-only.
# --live lets it cancel (needs KALSHI_LIVE_ENABLED=1 in .env).
GUARD_ARGS=--live --max-day-loss 15 --max-at-risk 60 --poll-s 60
