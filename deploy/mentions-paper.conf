# Arguments for `albert live mentions --env paper` (systemd unit albert-mentions@paper): the same bot
# on prod markets with simulated orders (albert.paper_trader); no order can leave this process.
# Started 2026-11-18 as the forward test of the 12 h early phase (research/mentions_ext Q2,
# L12h/m12c/extend). The same day the user promoted that phase to the live bot ("Deploy commit and
# merge"), so this mirrors the live bot's arguments (without --live) and serves as
# a simulated-vs-real fill check. Kill file: data/live/mentions/paper/STOP.
# Score with: python -m albert paper mentions-report
# 2026-11-19, user: "take the expected number of fills and limiting that to $15 instead. Going a bit
# over is acceptable if more get filled" and "dynamically manage s.t. if stuff overfills it can cancel
# orders; we want as close to the limit deployed as possible": expected fill cost (fills not yet
# settled + each resting bid's fill probability x price) <= $15, fills that push it over cancel resting
# bids; up to 6 events; hard cap $40 on resting bids + unsettled fills (research/mentions_budget).
MENTIONS_ARGS=--max-collateral 40 --max-expected 15 --max-daily-loss 15 --max-events 6 --margin 0.12 --early-hours 12
